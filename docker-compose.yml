services:
  postgres:
    image: postgres:16
    container_name: pipeline_pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pipeline_data:/var/lib/postgresql/data
      - ./:/project:ro

volumes:
  pipeline_data: